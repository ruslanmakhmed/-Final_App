apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
# Права на чтение: список подов/узлов для обнаружения целей и nodes/proxy для cAdvisor.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shortlink-prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "nodes/metrics", "pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shortlink-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: shortlink-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: shortlink
