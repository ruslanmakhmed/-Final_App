# Стенд: AlmaLinux 9.
#   192.168.1.25 — Docker/Ansible: Compose-стек, свой реестр :5000, управляющий узел Ansible, GitLab Runner
#   192.168.1.26 — фронтовой узел prod, GitLab CE :8929
#   192.168.1.22-24 — кластер k3s (master + 2 worker)
all:
  children:
    edge:
      vars:
        # После первого прогона вход root закрыт — дальше только служебный пользователь.
        # Первый прогон на чистом узле: ansible-playbook site.yml -e ansible_user=root
        ansible_user: shortlink
        ansible_ssh_private_key_file: ~/.ssh/shortlink_deploy
      children:
        edge_dev:
          hosts:
            edge-dev:
              ansible_host: 192.168.1.25
        edge_prod:
          hosts:
            edge-prod:
              ansible_host: 192.168.1.26
    # GitLab CE и раннер живут на тех же ВМ, что и фронты.
    gitlab:
      hosts:
        edge-prod:
    ci_runner:
      hosts:
        edge-dev:
    k3s:
      vars:
        ansible_user: root
      children:
        k3s_server:
          hosts:
            k3s-master:
              ansible_host: 192.168.1.22
        k3s_agent:
          hosts:
            k3s-worker-23:
              ansible_host: 192.168.1.23
            k3s-worker-24:
              ansible_host: 192.168.1.24
