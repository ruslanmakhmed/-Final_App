- name: Install required packages (Debian)
  ansible.builtin.apt:
    name: "{{ edge_packages }}"
    state: present
    update_cache: true
    # Не обновлять индекс чаще раза в час — иначе повторный прогон не будет changed=0.
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == 'Debian'

- name: Install required packages (RedHat)
  ansible.builtin.dnf:
    name: "{{ edge_packages }}"
    state: present
  when: ansible_facts['os_family'] == 'RedHat'
